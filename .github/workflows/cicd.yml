name: Deploy Go Application

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Create .env file 
        run: | 
          echo "PORT=${{ secrets.PORT }}" >> .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
      - name: Login to docker hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
      - name: Build docker image
        run: docker build -t /raihanmalay/test-server-go .
      - name: Push image to docker hub
        run: docker push raihanmalay/test-server-go:latest
  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      -name: Pull docker image
       run: docker pull raihanmalay/test-server-go:latest
      -name: Delete old container
       run: docker rm -f server-test-go
      -name: Run docker container
       run: docker run -d -p 4040:4040 --name server-test-go raihanmalay/test-server-go:latest
        